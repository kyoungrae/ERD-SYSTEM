services:
  mongodb:
    image: mongo:7.0
    container_name: erd-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=erd-system
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: erd-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  # 개발용 MongoDB 관리 UI (선택사항)
  mongo-express:
    image: mongo-express:latest
    container_name: erd-mongo-express
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_URL=mongodb://mongodb:27017/
      - ME_CONFIG_BASICAUTH=false
    depends_on:
      - mongodb
    restart: unless-stopped

volumes:
  mongodb_data:
  redis_data:
